databases:
  - name: hifistore-db
    databaseName: hifistore
    plan: free

services:
  # Бесплатный план: preDeployCommand недоступен, поэтому миграции и демо-админ
  # выполняются при старте через Store:AutoMigrate и Seed:Admin.
  - type: web
    name: hifistore-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/catalog/products
    envVars:
      - key: ConnectionStrings__Store
        fromDatabase:
          name: hifistore-db
          property: connectionString
      - key: Store__AutoMigrate
        value: "true"
      - key: Store__DemoCatalog
        value: "true"
      - key: Seed__Admin__Email
        value: demo-admin@hifistore.local
      - key: Seed__Admin__Password
        sync: false
      # Почта (см. раздел «Почта» в README). Ссылки в письмах ведут на витрину.
      # Без Email__Smtp__Host письма не отправляются, а пишутся в лог API.
      - key: Store__PublicUrl
        value: https://hifistore-web.onrender.com
      - key: Store__OwnerEmail
        sync: false
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__From
        sync: false

  - type: web
    name: hifistore-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        value: https://hifistore-api.onrender.com
